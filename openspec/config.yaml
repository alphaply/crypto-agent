schema: spec-driven

context: |
  需求范围与确认规则（与 AGENTS.md 的 Requirement Scope and Confirmation 一致）：
  - 只实现用户明确要求的行为。
  - 不得自行增加业务需求、替代数据源、跨交易所查询、自动降级或默认值填充。
  - 未明确的业务行为先提出问题，不得直接写入 specs、design 或 tasks 当作已确认需求。
  - 必要的内部实现细节可以自行决定，但会改变查询范围、结果含义或错误处理方式的选择必须先确认。
  - 建议与已确认需求分开列出。

operations:
  archive:
    guidance:
      - 用户要求 archive 时默认同时同步主规范并执行 Git 和 Docker 发版；用户明确缩小范围时以本次要求为准。
      - 遵循 AGENTS.md、openspec/specs/archive-release-workflow/spec.md 与 docs/DEPLOYMENT_GUIDE.md；完成任务、同步并校验主规范后再归档。
      - 仅提交本变更的实现、测试、文档、主规范和归档到 beta，保留无关本地修改，不得强推。
      - 提交后执行 powershell -NoProfile -File scripts/release-archived-change.ps1 -ArchiveName <YYYY-MM-DD-change-name>，自动重建前端与 Docker、隔离烟测、推送 origin/beta 并发布镜像。
      - 报告 Git commit、镜像标签和 digest；失败则停止后续步骤并报告部分完成状态。镜像发布不隐含生产容器重启。

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
