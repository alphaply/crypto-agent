[project]
name = "crypto-agent"
version = "0.2.0rc4"
description = "Crypto trading agent with FastAPI backend and React frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.34",
    "cryptography>=46.0.3",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14,<1.4.0",
    "langchain-anthropic>=1.5.0,<1.6.0",
    "langchain-openai>=1.4.0,<1.5.0",
    "langgraph>=1.2.9,<1.3.0",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.30,<2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
